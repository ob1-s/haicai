[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haicai"
version = "0.1.0"
description = "Escansão de haicai em português: sílabas poéticas por intervalo de hipóteses"
requires-python = ">=3.10"
dependencies = [
    "silabificador @ git+https://github.com/TigreGotico/silabificador",
    "verifiers>=0.1.14",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
