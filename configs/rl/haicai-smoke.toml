# Hosted RL: haicai-v1 + poolside/Laguna-XS-2.1 (grátis) — shape v1 nativo.
# Run de verdade depois: max_steps = 120, batch_size = 128.
# Smoke validado localmente: .venv/bin/eval haicai-v1 ... --env.agent.harness.id null
model = "poolside/Laguna-XS-2.1"

max_steps = 10
batch_size = 32
rollouts_per_example = 8

[sampling]
max_tokens = 512
temperature = 1.0

[[env]]
taskset = { id = "ob1/haicai-v1" }
harness = { id = "null", runtime = { type = "subprocess" } }

[eval]
interval = 5
num_examples = 16
rollouts_per_example = 1
eval_base_model = true

[[eval.env]]
taskset = { id = "ob1/haicai-v1" }
harness = { id = "null", runtime = { type = "subprocess" } }
