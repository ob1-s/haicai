[project]
name = "haicai"
description = "Escrever haicai 5-7-5 em português brasileiro; recompensa determinística de escansão + ortografia."
tags = ["creative-writing", "portuguese", "single-turn", "deterministic"]
version = "0.1.1"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["haicai.py", "haicai_vendor", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
