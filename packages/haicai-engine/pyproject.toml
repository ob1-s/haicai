[project]
name = "haicai"
version = "0.1.0"
description = "Escansão de haicai em português: sílabas poéticas por intervalo de hipóteses + cobertura ortográfica AO90."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bruno Oliveira" }]
keywords = ["haiku", "portuguese", "poetry", "scansion"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ob1-s/haicai"
Repository = "https://github.com/ob1-s/haicai/tree/main/packages/haicai-engine"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haicai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
